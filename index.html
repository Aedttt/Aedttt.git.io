<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墓碑牛逼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-size: 12px; /* 字体偏小 */
            line-height: 1.5;
            background-color: #f5f5f5;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 6px;
        }
        .title {
            font-size: 16px;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 12px;
            margin-bottom: 20px;
            color: #555;
        }
        /* 图片网格布局，自动排 */
        .image‑grid {
            display: grid;
            grid-template-columns: repeat(auto‑fill, minmax(100px, 1fr));
            gap: 14px;
        }
        .image‑item {
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }
        .image‑item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .image‑caption {
            padding: 6px 8px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 这里替换标题、描述文字 -->
        <h2 class="title">墓碑美丽图片展示</h2>
        <p class="desc">墓碑很好不爱请别伤害，墓碑牛逼死</p>

        <!-- 图片区域，复制 <div class="image-item"> 块增加更多图片 -->
        <div class="image‑grid">
            <div class="image‑item">
                <img src="粑粑.jpg" alt="图1">
                <div class="image‑caption">这是墓碑传神名句所有人集体背诵</div>
            </div>
            <div class="image‑item">
                <img src="粑粑人.jpg" alt="图2">
                <div class="image‑caption">这个是墓碑绝美自拍照，美颜失效错愕的眼神太可爱了吧</div>
            </div>
            <div class="image‑item">
                <img src="粑粑人二号.jpg" alt="图3">
                <div class="image‑caption">你这他妈让我咋编</div>
            </div>
           <div class="image‑item">
                <img src="粑粑人三号.jpg" alt="图4">
                <div class="image‑caption">美美仰头，我直接爱了吧</div>
           </div>
           <div class="image‑item">
                <img src="嘴.jpg" alt="图4">
                <div class="image‑caption">墓碑画的可爱小嘴巴</div>
           </div>
           <div class="image‑item">
                <img src="化妆.jpg" alt="图5">
                <div class="image‑caption">墓碑化妆，扫死人了好吧这是我杯杯（笑，心思都露了出来）</div>
           </div>
           <div class="image‑item">
                <img src="人.jpg" alt="图5">
                <div class="image‑caption">墓碑cosplay</div>
           </div>
           <div class="image‑item">
                <img src="7.jpg" alt="图5">
                <div class="image‑caption">墓碑霸气回怼</div>
           </div>
           <div class="image‑item">
                <img src="6.jpg" alt="图5">
                <div class="image‑caption">墓碑咆哮</div>
           </div>
           <div class="image‑item">
                <img src="狗.jpg" alt="图5">
                <div class="image‑caption">墓碑本人画像立绘</div>
           </div>
           <div class="image‑item">
                <img src="屁.jpg" alt="图5">
                <div class="image‑caption">墓碑照镜子</div>
           </div>
           <div class="image‑item">
                <img src="万圣节.jpg" alt="图5">
                <div class="image‑caption">万圣节限定墓碑</div>
           </div>
           <div class="image‑item">
                <img src="大茄子.jpg" alt="图5">
                <div class="image‑caption">大茄子墓碑</div>
           </div>
           <div class="image‑item">
                <img src="坤坤.jpg" alt="图5">
                <div class="image‑caption">坤坤墓碑</div>
           </div>
           <div class="image‑item">
                <img src="蛋小蓝.jpg" alt="图5">
                <div class="image‑caption">蛋小蓝墓碑:你有毒是不是？</div>
        </div>
    </div>
</body>
</html>
